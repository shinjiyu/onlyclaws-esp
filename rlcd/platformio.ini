; OnlyClaws agent runtime — ESP32-S3 core, audio and panel are compile-time plugins.
;
;   esp32-s3-bare         core only (Wi-Fi, cloud, Lua). No panel, no codec.
;   esp32-s3-rlcd-42      core + ES8311 + ST7305 + BLE
;   esp32-s3-epaper-397   core + ES8311 + GxEPD2 (BLE off, heap)
;   esp32-s3-amoled-175c  core + ES8311 + CO5300 stub (466 round) + ml; web-flash SKU
;   esp32-c3-folo-passport Folo AI Passport (C3 + ST7789 240x320 + ES8311); web-flash SKU
;   esp32-roarm-m2        core + STS arm (classic ESP32, headless)

[common]
; Pin platform away from espressif32@8.0.0 (2026-10-19), which pulls Arduino 3.3 /
; toolchain 14.2 and breaks the Arduino 2.0.17 + GCC 12.2 pins below.
; Unqualified toolchain pins resolve under platformio/ (no 12.2.0+20230208 there);
; the matching builds live under espressif/.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
	--before=usb_reset
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
platform_packages =
	espressif/toolchain-riscv32-esp@12.2.0+20230208
	espressif/toolchain-xtensa-esp32s3@12.2.0+20230208
	espressif/toolchain-xtensa-esp32@12.2.0+20230208
	framework-arduinoespressif32@3.20017.0
monitor_filters = time, default
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	links2004/WebSockets @ 2.6.1
	h2zero/NimBLE-Arduino @ 1.4.2
	ricmoo/QRCode @ 0.0.1

; On-device inference plugin (TFLite Micro + esp-nn, vendored by
; scripts/fetch_tflm.sh into lib/). S3 envs only; needs C++17.
[ml]
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DOC_PLUGIN_ML
	-DTF_LITE_STATIC_MEMORY
	-DTF_LITE_DISABLE_X86_NEON
	-DESP_NN
	-DCONFIG_NN_OPTIMIZED=1
	-Ilib/tflm/third_party/flatbuffers/include
	-Ilib/tflm/third_party/gemmlowp
	-Ilib/tflm/third_party/kissfft
	-Ilib/tflm/third_party/ruy

; ESP32-S3 bare module: cloud + Lua, no panel and no codec.
[env:esp32-s3-bare]
extends = common
build_unflags = ${ml.build_unflags}
build_flags =
	${ml.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<co5300_amoled.cpp>
	-<st7789_panel.cpp>
	-<audio_es8311.cpp>
	-<arm_roarm.cpp>
	-<tts_voice_blob.S>

; Waveshare ESP32-S3-RLCD-4.2 (ST7305 400x300) = core + audio + panel + BLE
[env:esp32-s3-rlcd-42]
extends = common
build_unflags = ${ml.build_unflags}
build_flags =
	${ml.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DBOARD_PANEL_RLCD
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DOC_PLUGIN_BLE
	-DOC_PLUGIN_TTS
	-I${PROJECT_DIR}/third_party/esp_tts/include
	-L${PROJECT_DIR}/third_party/esp_tts/esp32s3
	-Wl,--start-group
	-lesp_tts_chinese
	-lvoice_set_xiaole
	-Wl,--end-group
	-Wa,-I${PROJECT_DIR}
	-DARDUINO_LOOP_STACK_SIZE=24576
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<co5300_amoled.cpp>
	-<st7789_panel.cpp>
	-<arm_roarm.cpp>

; Waveshare ESP32-S3-ePaper-3.97 (GDEM0397T81 800x480) = core + audio + panel
[env:esp32-s3-epaper-397]
extends = common
build_unflags = ${ml.build_unflags}
build_flags =
	${ml.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DBOARD_PANEL_EPAPER
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DOC_PLUGIN_TTS
	-I${PROJECT_DIR}/third_party/esp_tts/include
	-L${PROJECT_DIR}/third_party/esp_tts/esp32s3
	-Wl,--start-group
	-lesp_tts_chinese
	-lvoice_set_xiaole
	-Wl,--end-group
	-Wa,-I${PROJECT_DIR}
	-DARDUINO_LOOP_STACK_SIZE=32768
lib_deps =
	${common.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.5
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<st7305_rlcd.cpp>
	-<co5300_amoled.cpp>
	-<st7789_panel.cpp>
	-<arm_roarm.cpp>

; Waveshare ESP32-S3-Touch-AMOLED-1.75(C) — web-flash product (stub panel until CO5300).
; No TTS/BLE in this env: fewer vendored deps for CI; audio codec path still linked.
[env:esp32-s3-amoled-175c]
extends = common
board_upload.flash_size = 16MB
build_unflags = ${ml.build_unflags}
build_flags =
	${ml.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DBOARD_PANEL_AMOLED
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DARDUINO_LOOP_STACK_SIZE=24576
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<st7789_panel.cpp>
	-<arm_roarm.cpp>
	-<tts_voice_blob.S>

; FoloToy AI Passport — ESP32-C3, 8MB, no PSRAM, ST7789 240x320 + ES8311.
; No ML/TTS/BLE (heap). See doc/structurizr/FOLO-PASSPORT-PRODUCT.md.
[env:esp32-c3-folo-passport]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8MB.csv
board_build.f_cpu = 160000000L
monitor_filters = time, default
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	links2004/WebSockets @ 2.6.1
	h2zero/NimBLE-Arduino @ 1.4.2
	ricmoo/QRCode @ 0.0.1
lib_ignore = tflm, esp-nn
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_PANEL_ST7789
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DARDUINO_LOOP_STACK_SIZE=12288
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<co5300_amoled.cpp>
	-<arm_roarm.cpp>
	-<tts_voice_blob.S>

; Waveshare RoArm-M2 driver board (classic ESP32 + Feetech STS bus on GPIO18/19)
; = core + arm. No panel, codec or BLE; cloud wire + arm passthrough.
[env:esp32-roarm-m2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_4MB.csv
monitor_filters = time, default
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	links2004/WebSockets @ 2.6.1
	h2zero/NimBLE-Arduino @ 1.4.2
lib_ignore = tflm, esp-nn
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DBOARD_ROARM
	-DOC_PLUGIN_ARM
	-DARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<co5300_amoled.cpp>
	-<st7789_panel.cpp>
	-<audio_es8311.cpp>
	-<arm_stub.cpp>
	-<tts_voice_blob.S>
