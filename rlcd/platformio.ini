; Waveshare ESP32-S3-RLCD-4.2 — OnlyClaws agent runtime (Lua)
[env:esp32-s3-rlcd-42]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Override at flash time: pio run -t upload --upload-port /dev/cu.usbmodemXXXX
; upload_port = /dev/cu.usbmodem21101
upload_flags =
	--before=usb_reset

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

platform_packages =
	toolchain-riscv32-esp@12.2.0+20230208
	toolchain-xtensa-esp32s3@12.2.0+20230208
	toolchain-xtensa-esp32@12.2.0+20230208
	framework-arduinoespressif32@4.20017.0

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_LOOP_STACK_SIZE=24576

build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>

; EspLuaEngine is vendored under lib/EspLuaEngine (avoids GitHub fetch during build).
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	h2zero/NimBLE-Arduino @ 1.4.2
	ricmoo/QRCode @ 0.0.1

monitor_filters = time, default
