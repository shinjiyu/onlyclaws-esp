; OnlyClaws agent runtime — ESP32-S3 core, audio and panel are compile-time plugins.
;
;   esp32-s3-bare         core only (Wi-Fi, cloud, Lua). No panel, no codec.
;   esp32-s3-rlcd-42      core + ES8311 + ST7305 + BLE
;   esp32-s3-epaper-397   core + ES8311 + GxEPD2 (BLE off, heap)
;   esp32-roarm-m2        core + STS arm (classic ESP32, headless)

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
	--before=usb_reset
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
platform_packages =
	toolchain-riscv32-esp@12.2.0+20230208
	toolchain-xtensa-esp32s3@12.2.0+20230208
	toolchain-xtensa-esp32@12.2.0+20230208
	framework-arduinoespressif32@3.20017.0
monitor_filters = time, default
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	h2zero/NimBLE-Arduino @ 1.4.2
	ricmoo/QRCode @ 0.0.1

; ESP32-S3 bare module: cloud + Lua, no panel and no codec.
[env:esp32-s3-bare]
extends = common
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<audio_es8311.cpp>
	-<arm_roarm.cpp>

; Waveshare ESP32-S3-RLCD-4.2 (ST7305 400x300) = core + audio + panel + BLE
[env:esp32-s3-rlcd-42]
extends = common
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DBOARD_PANEL_RLCD
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DOC_PLUGIN_BLE
	-DARDUINO_LOOP_STACK_SIZE=24576
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<arm_roarm.cpp>

; Waveshare ESP32-S3-ePaper-3.97 (GDEM0397T81 800x480) = core + audio + panel
[env:esp32-s3-epaper-397]
extends = common
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DBOARD_PANEL_EPAPER
	-DOC_PLUGIN_PANEL
	-DOC_PLUGIN_AUDIO
	-DARDUINO_LOOP_STACK_SIZE=32768
lib_deps =
	${common.lib_deps}
	zinggjm/GxEPD2 @ ^1.6.5
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<st7305_rlcd.cpp>
	-<arm_roarm.cpp>

; Waveshare RoArm-M2 driver board (classic ESP32 + Feetech STS bus on GPIO18/19)
; = core + arm. No panel, codec or BLE; cloud wire + arm passthrough.
[env:esp32-roarm-m2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
monitor_filters = time, default
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BusIO
	bblanchon/ArduinoJson @ ^6.21.5
	h2zero/NimBLE-Arduino @ 1.4.2
build_flags =
	-DBOARD_ROARM
	-DOC_PLUGIN_ARM
	-DARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
	+<*>
	-<character_ui.cpp>
	-<wake_word.cpp>
	-<voice_proc.cpp>
	-<epd397_panel.cpp>
	-<st7305_rlcd.cpp>
	-<audio_es8311.cpp>
	-<arm_stub.cpp>
