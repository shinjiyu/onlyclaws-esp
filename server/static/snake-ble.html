  <h1>Snake 手机控制</h1>
  <p><b>推荐（任意浏览器）：</b>手机连与板子同一 Wi‑Fi，打开屏幕上显示的地址，例如：</p>
  <p><code>http://192.168.101.26/</code></p>
  <p>板子屏上会印 IP；打开后即可用方向键，不依赖蓝牙、也不走公网。</p>
  <p>Web Bluetooth 仅部分 Android Chrome 可用，很多浏览器不行——请改用上面的局域网页面。</p>
